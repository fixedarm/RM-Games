name: Natural Remedy Advisor APK

on:
  push:
    branches: [ccr-7da36929-4k93dq]
    paths: ["natural-remedy-advisor/**", ".github/workflows/natural-remedy-advisor-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: natural-remedy-advisor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: natural-remedy-advisor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk natural-remedy-advisor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: natural-remedy-advisor-apk
          path: natural-remedy-advisor/natural-remedy-advisor.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: natural-remedy-advisor-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Natural Remedy Advisor test build ${{ github.run_number }}
          prerelease: true
          files: natural-remedy-advisor/natural-remedy-advisor.apk
          body: Debug APK for testing. On your phone, download it and allow "Install unknown apps" when asked.
